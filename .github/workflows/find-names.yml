name: Hitta lediga varumärkesnamn

on:
  workflow_dispatch:
    inputs:
      max_names:
        description: "Hur många namn ska kontrolleras? (1–500)"
        required: true
        default: "200"
      seed:
        description: "Ändra talet för en ny blandning av namn"
        required: true
        default: "42"
      custom_names:
        description: "Valfria egna namn, separerade med kommatecken"
        required: false
        default: ""
      names_file:
        description: "Valfri fil med ett kuraterat namn per rad"
        required: false
        default: ""
      output_dir:
        description: "Mapp där den nya rapporten ska sparas"
        required: true
        default: "results"

permissions:
  contents: write

concurrency:
  group: brand-name-finder
  cancel-in-progress: false

jobs:
  find-names:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hämta repot
        uses: actions/checkout@v4

      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Generera och kontrollera namn
        env:
          MAX_NAMES: ${{ inputs.max_names }}
          SEED: ${{ inputs.seed }}
          CUSTOM_NAMES: ${{ inputs.custom_names }}
          NAMES_FILE: ${{ inputs.names_file }}
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          args=(
            --max-names "$MAX_NAMES"
            --seed "$SEED"
            --custom "$CUSTOM_NAMES"
            --output-dir "$OUTPUT_DIR"
          )
          if [[ -n "$NAMES_FILE" ]]; then
            args+=(--names-file "$NAMES_FILE")
          fi
          python brand_name_finder.py "${args[@]}"

      - name: Lägg resultatet i körningens sammanfattning
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: cat "$OUTPUT_DIR/RESULTS.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Spara CSV, Markdown och HTML som nedladdningsbara filer
        uses: actions/upload-artifact@v4
        with:
          name: brand-name-results-${{ github.run_number }}
          path: ${{ inputs.output_dir }}/
          retention-days: 30

      - name: Uppdatera resultatfilerna i repot
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_DIR"
          if git diff --cached --quiet; then
            echo "Inga resultatfiler ändrades."
          else
            git commit -m "Update brand name results"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
